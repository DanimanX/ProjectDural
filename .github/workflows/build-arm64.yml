# Automatically builds and verifies the ROM-free AArch64 / OpenGL ES 2.0
# PortMaster package for ProjectDural (Anbernic RG34XX / Allwinner H700 and
# compatible ARM64 Linux handhelds), runs ROM-free SLJIT + SoundWorker + 3D export
# verification, and publishes GitHub Releases on tags.
#
# Zero copyrighted ROMs or ROM-derived game code ever enter the build or artifacts.
name: Build ARM64 PortMaster

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_cpu:
        description: 'Target ARM64 CPU (cortex_a53 for RG34XX/H700, cortex_a55 for RK3566, generic)'
        required: false
        default: 'cortex_a53'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -qy --no-install-recommends \
            build-essential python3 curl git tar xz-utils zip file binutils

      - name: Cache cross-compile dependencies (Zig, SDL2 headers, zlib, Dear ImGui)
        uses: actions/cache@v4
        with:
          path: |
            deps
            extern
            !deps/zig-cache
          key: projectdural-deps-${{ hashFiles('tools/build-arm64.sh') }}

      - name: Cross-compile AArch64 runtime and assemble PortMaster package
        env:
          TARGET_CPU: ${{ github.event.inputs.target_cpu || 'cortex_a53' }}
        run: |
          chmod +x tools/build-arm64.sh tools/build-host-test.sh portmaster/*.sh
          tools/build-arm64.sh
          (cd dist && sha256sum ProjectDural-PortMaster-aarch64.zip > ProjectDural-PortMaster-aarch64.zip.sha256)
          ls -lh dist/

      - name: Run ROM-free synthetic SLJIT + SoundWorker + 3D export verification
        run: |
          tools/build-host-test.sh 60

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDural-PortMaster-aarch64
          path: |
            dist/ProjectDural-PortMaster-aarch64.zip
            dist/ProjectDural-PortMaster-aarch64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES="dist/ProjectDural-PortMaster-aarch64.zip dist/ProjectDural-PortMaster-aarch64.zip.sha256"
          # Per-release highlights live in docs/release-notes/<tag>.md and are prepended to the
          # notes every release shares. A tag without its own file still gets the common part,
          # so publishing never depends on remembering to write one.
          cat > dist/notes-tail.md <<'EOF'
          Automated ROM-free AArch64 / OpenGL ES 2.0 / SLJIT PortMaster build of **ProjectDural**, for Anbernic RG34XX / Allwinner H700 (Mali-G31) and compatible ARM64 Linux handhelds, including the Powkiddy RGB30 (Mali-G52) and TrimUI Smart Pro (PowerVR GE8300).

          ### Contents (Zero ROMs / Zero Game Code)
          - `Virtua Fighter 2.sh` (PortMaster launcher: starts the cores the 4-thread pipeline needs, pins the CPU governor to `performance`, prints a `[sys]` hardware line to `log.txt`)
          - `projectdural/vf2.aarch64` (ARM64 Cortex-A53, SLJIT ARM64 i960 JIT, Core 2 SCSP sound worker, OpenGL ES 2.0, ARM64 NEON, max `GLIBC_2.28`, statically linked `zlib` & `libc++`)
          - `projectdural/assets/backgrounds/select.png` (painted 3:2 character select sides, CC BY 4.0)
          - `projectdural/gamecontrollerdb.txt`, PortMaster metadata, and licences

          ### Quick Setup (BYOD)
          1. Extract `ProjectDural-PortMaster-aarch64.zip` into your handheld's `ports/` folder.
          2. Copy your own legal MAME `vf2.zip` (Version 2.1) into `ports/projectdural/roms/vf2.zip`.
          3. Launch **Virtua Fighter 2** — SLJIT compiles the i960 program to native ARM64 automatically on startup (no PC pre-build required!).

          Report issues at https://github.com/DanimanX/ProjectDural/issues — `ports/projectdural/log.txt` plus the `[sys]` and `[perf]` lines there make a performance report actionable.
          EOF
          sed -i 's/^          //' dist/notes-tail.md
          if [ -f "docs/release-notes/$TAG.md" ]; then
            cat "docs/release-notes/$TAG.md" dist/notes-tail.md > dist/release-notes.md
          else
            cat dist/notes-tail.md > dist/release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "ProjectDural $TAG (ARM64 PortMaster)" \
              --notes-file dist/release-notes.md
          fi
